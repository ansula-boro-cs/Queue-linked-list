<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Queue Using Linked List</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Queue Using Linked List</h1>

        <p class="description">
            A simple implementation of Queue using Linked List.
        </p>

        <div class="input-section">

            <input type="number" id="valueInput" placeholder="Enter value">

            <button onclick="enqueue()">Insert</button>

            <button onclick="dequeue()">Delete</button>

            <button onclick="searchValue()">Search</button>

            <button onclick="displayQueue()">Display</button>

        </div>

        <div id="message"></div>

        <h2>Queue</h2>

        <div id="queueDisplay" class="queue-display">
            Queue is empty
        </div>

        <div class="info">

            <p>
                <strong>Front:</strong>
                <span id="frontValue">NULL</span>
            </p>

            <p>
                <strong>Rear:</strong>
                <span id="rearValue">NULL</span>
            </p>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
